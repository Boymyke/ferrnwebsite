<!doctype html>

<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width,initial-scale=1" name="viewport" />
    <meta content="#0D47C7" name="theme-color" />
    <meta
      content="Ataam digital operations platform proposal."
      name="description"
    />
    <title>Ataam — Product Proposal</title>
    <link
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 478 478'%3E%3Crect width='478' height='478' fill='%23000'/%3E%3Cpath d='M320.71 157.291V320.71H157.291V266.355H264.499V210.193H174.294V157.291H320.71Z' fill='%23FF4100'/%3E%3C/svg%3E"
      rel="icon"
      type="image/svg+xml"
    />
    <style>
      :root {
        --navy: #123f56;
        --navy2: #0b2f3d;
        --blue: #2f8fb3;
        --aqua: #64c4c1;
        --mint: #eaf7f4;
        --sky: #edf7fb;
        --ink: #10242e;
        --muted: #60717a;
        --paper: #f7f8f6;
        --white: #fff;
        --line: rgba(10, 10, 10, 0.12);
        --soft: #f1f6f6;
        --radius: 24px;
        --shadow: 0 22px 60px rgba(18, 63, 86, 0.12);
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: var(--paper);
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      button {
        font: inherit;
      }
      .shell {
        width: min(calc(100% - 44px), 1380px);
        margin: auto;
      }
      .topbar {
        position: fixed;
        z-index: 50;
        top: 14px;
        left: 50%;
        transform: translateX(-50%);
        width: min(calc(100% - 28px), 1400px);
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        padding: 9px 10px;
        border: 1px solid rgba(10, 10, 10, 0.12);
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(18px);
        border-radius: 999px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
      }
      .agency {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }
      .ferrn {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: #0a0a0a;
        flex: 0 0 auto;
      }
      .ferrn svg {
        width: 22px;
        height: 22px;
      }
      .agency-copy b,
      .agency-copy span {
        display: block;
        white-space: nowrap;
      }
      .agency-copy b {
        font-size: 14px;
      }
      .agency-copy span {
        font-size: 14px;
        color: var(--muted);
      }
      .top-actions {
        display: flex;
        gap: 8px;
      }
      .btn {
        border: 0;
        border-radius: 999px;
        padding: 12px 16px;
        font-size: 14px;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
      }
      .btn.primary {
        background: var(--navy);
        color: #fff;
      }
      .btn.secondary {
        background: var(--blue);
        color: #fff;
      }
      .proposal-page {
        min-height: 100vh;
        padding: 122px 0 54px;
        position: relative;
        overflow: hidden;
      }
      .proposal-page.dark {
        background: var(--navy2);
        color: white;
      }
      .proposal-page.white {
        background: #fff;
      }
      .proposal-page.mint {
        background: linear-gradient(145deg, #f7fbfa, var(--mint));
      }
      .proposal-page.sky {
        background: linear-gradient(145deg, #fff, var(--sky));
      }
      .page-head {
        display: flex;
        justify-content: space-between;
        gap: 30px;
        align-items: flex-start;
        margin-bottom: 34px;
      }
      .client-mark {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .ataam-word {
        font-size: 22px;
        letter-spacing: 0.18em;
        font-weight: 800;
        color: var(--navy);
        text-transform: uppercase;
      }
      .dark .ataam-word {
        color: #fff;
      }
      .client-mark small {
        display: block;
        font-size: 14px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
        margin-top: 3px;
      }
      .dark .client-mark small {
        color: rgba(255, 255, 255, 0.58);
      }
      .section-no {
        font-size: 14px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        font-weight: 800;
        color: var(--blue);
      }
      .dark .section-no {
        color: var(--aqua);
      }
      h1,
      h2,
      h3,
      p {
        margin-top: 0;
      }
      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        padding: 8px 11px;
        border: 1px solid var(--line);
        border-radius: 999px;
        font-size: 14px;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--navy);
      }
      .eyebrow i {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--aqua);
      }
      .dark .eyebrow {
        border-color: rgba(255, 255, 255, 0.16);
        color: #fff;
      }
      .display {
        font-size: clamp(50px, 6.4vw, 104px);
        line-height: 0.92;
        letter-spacing: -0.065em;
        font-weight: 700;
        margin: 18px 0 0;
      }
      .display em {
        font-style: normal;
        color: var(--blue);
      }
      .lead {
        font-size: clamp(16px, 1.4vw, 20px);
        line-height: 1.65;
        color: var(--muted);
        max-width: 740px;
      }
      .dark .lead {
        color: rgba(255, 255, 255, 0.67);
      }
      .hero-grid {
        display: grid;
        grid-template-columns: 1.03fr 0.97fr;
        gap: 54px;
        align-items: center;
      }
      .hero-photo {
        min-height: 590px;
        border-radius: 32px;
        overflow: hidden;
        position: relative;
        box-shadow: var(--shadow);
        background-image:
          linear-gradient(180deg, transparent 48%, rgba(0, 0, 0, 0.82)),
          url("DATAURI");
        background-size: cover;
        background-position: center;
      }
      .hero-card {
        position: absolute;
        left: 24px;
        right: 24px;
        bottom: 24px;
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(12px);
        border-radius: 20px;
        padding: 20px;
        color: var(--ink);
      }
      .hero-card small {
        font-size: 14px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--blue);
        font-weight: 800;
      }
      .hero-card h3 {
        font-size: 28px;
        letter-spacing: -0.04em;
        margin: 7px 0;
      }
      .hero-card p {
        font-size: 14px;
        line-height: 1.55;
        color: var(--muted);
        margin: 0;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 28px;
      }
      .chip {
        padding: 10px 13px;
        border: 1px solid var(--line);
        border-radius: 999px;
        font-size: 14px;
        background: rgba(255, 255, 255, 0.72);
      }
      .hero-foot {
        display: flex;
        justify-content: space-between;
        gap: 20px;
        padding-top: 22px;
        border-top: 1px solid var(--line);
        margin-top: 36px;
        color: var(--muted);
        font-size: 14px;
        letter-spacing: 0.09em;
        text-transform: uppercase;
      }
      .title {
        font-size: clamp(38px, 4.5vw, 70px);
        line-height: 0.98;
        letter-spacing: -0.055em;
        max-width: 920px;
        margin: 8px 0 0;
      }
      .title span {
        color: var(--blue);
      }
      .dark .title span {
        color: var(--aqua);
      }
      .section-intro {
        display: grid;
        grid-template-columns: 1.2fr 0.8fr;
        gap: 42px;
        align-items: end;
        margin-bottom: 34px;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 14px;
      }
      .card {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 22px;
        min-height: 190px;
      }
      .dark .card {
        background: rgba(255, 255, 255, 0.065);
        border-color: rgba(255, 255, 255, 0.14);
      }
      .card .num {
        font-size: 14px;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: var(--blue);
        font-weight: 800;
      }
      .dark .card .num {
        color: var(--aqua);
      }
      .card h3 {
        font-size: 22px;
        letter-spacing: -0.035em;
        margin: 18px 0 9px;
      }
      .card p {
        font-size: 14px;
        line-height: 1.6;
        color: var(--muted);
        margin: 0;
      }
      .dark .card p {
        color: rgba(255, 255, 255, 0.62);
      }
      .problem-grid {
        display: grid;
        grid-template-columns: 1.2fr 0.8fr;
        gap: 14px;
      }
      .problem-main {
        background: var(--navy);
        color: #fff;
        border-radius: 24px;
        padding: 28px;
        min-height: 340px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .problem-main h3 {
        font-size: 36px;
        line-height: 1.03;
        letter-spacing: -0.05em;
        max-width: 700px;
      }
      .problem-main p {
        color: rgba(255, 255, 255, 0.68);
        font-size: 14px;
        line-height: 1.65;
        max-width: 680px;
      }
      .truths {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }
      .truth {
        padding: 14px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.08);
      }
      .truth small {
        display: block;
        color: var(--aqua);
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        font-weight: 800;
        margin-bottom: 7px;
      }
      .truth strong {
        font-size: 14px;
        line-height: 1.4;
      }
      .problem-side {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
      .mini {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 20px;
      }
      .mini b {
        display: block;
        font-size: 16px;
        margin: 11px 0 7px;
      }
      .mini p {
        font-size: 14px;
        line-height: 1.55;
        color: var(--muted);
        margin: 0;
      }
      .method-grid {
        display: grid;
        grid-template-columns: 0.76fr 1.24fr;
        gap: 18px;
      }
      .steps {
        display: grid;
        gap: 10px;
      }
      .step {
        display: grid;
        grid-template-columns: 44px 1fr;
        gap: 14px;
        align-items: start;
        padding: 15px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.04);
      }
      .step span {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: var(--aqua);
        color: var(--navy2);
        font-weight: 800;
        font-size: 14px;
      }
      .step b {
        display: block;
        margin: 2px 0 4px;
        font-size: 14px;
      }
      .step p {
        font-size: 14px;
        color: rgba(255, 255, 255, 0.6);
        line-height: 1.5;
        margin: 0;
      }
      .prototype {
        background: #f5f8f8;
        border-radius: 26px;
        padding: 16px;
        color: var(--ink);
        min-height: 430px;
      }
      .browser {
        border-radius: 18px;
        overflow: hidden;
        background: white;
        box-shadow: 0 20px 55px rgba(0, 0, 0, 0.18);
        height: 100%;
      }
      .browser-top {
        height: 40px;
        background: #edf1f1;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 14px;
      }
      .browser-top i {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #bec9cc;
      }
      .app {
        display: grid;
        grid-template-columns: 160px 1fr;
        min-height: 370px;
      }
      .side {
        background: var(--navy);
        color: #fff;
        padding: 18px 13px;
      }
      .side-brand {
        font-size: 14px;
        font-weight: 800;
        letter-spacing: 0.15em;
        margin-bottom: 26px;
      }
      .navitem {
        font-size: 14px;
        padding: 9px 10px;
        border-radius: 10px;
        margin-bottom: 5px;
        color: rgba(255, 255, 255, 0.64);
      }
      .navitem.active {
        background: rgba(100, 196, 193, 0.2);
        color: #fff;
        border-left: 2px solid var(--aqua);
      }
      .dash {
        padding: 22px;
        background: #fbfcfb;
      }
      .dash-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .dash-head h3 {
        font-size: 27px;
        margin: 4px 0;
      }
      .avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: var(--navy);
        color: #fff;
        display: grid;
        place-items: center;
        font-size: 14px;
      }
      .stat-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
        margin: 14px 0;
      }
      .stat {
        padding: 12px;
        border-radius: 12px;
        background: #fff;
        border: 1px solid var(--line);
      }
      .stat small {
        font-size: 14px;
        color: var(--muted);
      }
      .stat strong {
        display: block;
        font-size: 20px;
        margin-top: 5px;
      }
      .stat.accent {
        background: var(--blue);
        color: #fff;
        border-color: transparent;
      }
      .stat.accent small {
        color: rgba(255, 255, 255, 0.72);
      }
      .dash-panels {
        display: grid;
        grid-template-columns: 1.35fr 0.65fr;
        gap: 8px;
      }
      .panel {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px;
        min-height: 160px;
      }
      .row {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        padding: 9px 0;
        border-bottom: 1px solid var(--line);
        font-size: 14px;
      }
      .row:last-child {
        border-bottom: 0;
      }
      .pulse {
        height: 92px;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--mint), #fff);
        display: grid;
        place-items: center;
        text-align: center;
      }
      .pulse strong {
        font-size: 30px;
        color: var(--navy);
      }
      .pulse small {
        display: block;
        font-size: 14px;
        color: var(--muted);
      }
      .prototype-note {
        font-size: 14px;
        color: rgba(255, 255, 255, 0.52);
        margin-top: 10px;
      }
      .scope-grid {
        display: grid;
        grid-template-columns: 1.08fr 0.92fr;
        gap: 18px;
      }
      .module-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .module {
        border: 1px solid var(--line);
        border-radius: 15px;
        padding: 15px;
        background: #fff;
      }
      .module b {
        display: block;
        font-size: 14px;
        margin-bottom: 6px;
      }
      .module p {
        font-size: 14px;
        line-height: 1.5;
        color: var(--muted);
        margin: 0;
      }
      .module.analytics {
        background: var(--navy);
        color: #fff;
      }
      .module.analytics p {
        color: rgba(255, 255, 255, 0.62);
      }
      .timeline {
        background: var(--navy2);
        color: #fff;
        border-radius: 24px;
        padding: 20px;
      }
      .timeline h3 {
        font-size: 25px;
        letter-spacing: -0.04em;
        margin-bottom: 14px;
      }
      .timeline-row {
        display: grid;
        grid-template-columns: 74px 1fr;
        gap: 12px;
        padding: 10px 0;
        border-top: 1px solid rgba(255, 255, 255, 0.12);
      }
      .timeline-row:first-of-type {
        border-top: 0;
      }
      .timeline-row strong {
        font-size: 14px;
        color: var(--aqua);
      }
      .timeline-row span {
        font-size: 14px;
        line-height: 1.45;
        color: rgba(255, 255, 255, 0.72);
      }
      .post-mvp {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 8px;
        margin-top: 12px;
      }
      .month {
        padding: 10px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.07);
      }
      .month b {
        display: block;
        font-size: 14px;
        color: var(--aqua);
        margin-bottom: 4px;
      }
      .month span {
        font-size: 14px;
        line-height: 1.35;
        color: rgba(255, 255, 255, 0.62);
      }
      .team-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin-bottom: 20px;
      }
      .person {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 20px;
        min-height: 205px;
      }
      .person .initials {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: var(--navy);
        color: #fff;
        font-weight: 800;
        font-size: 14px;
        margin-bottom: 18px;
      }
      .person h3 {
        font-size: 18px;
        margin-bottom: 5px;
      }
      .person .role {
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--blue);
        font-weight: 800;
        margin-bottom: 10px;
      }
      .person p {
        font-size: 14px;
        line-height: 1.55;
        color: var(--muted);
      }
      .person-credentials {
        margin: 12px 0 0;
        padding: 0;
        list-style: none;
        display: grid;
        gap: 8px;
      }
      .person-credentials li {
        position: relative;
        padding-left: 15px;
        font-size: 13px;
        line-height: 1.45;
        color: var(--muted);
      }
      .person-credentials li::before {
        content: "•";
        position: absolute;
        left: 0;
        top: 0;
        color: var(--blue);
        font-weight: 900;
      }
      .person-credentials strong {
        font-weight: 700;
        color: var(--ink);
      }
      .placeholder {
        border-style: dashed;
        background: #f9fbfb;
      }
      .credentials {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
      }
      .cred {
        border-radius: 18px;
        padding: 18px;
        background: var(--navy2);
        color: #fff;
      }
      .cred b {
        display: block;
        font-size: 15px;
        margin-bottom: 7px;
      }
      .cred p {
        font-size: 14px;
        line-height: 1.5;
        color: rgba(255, 255, 255, 0.64);
        margin: 0;
      }
      .budget-layout {
        display: grid;
        grid-template-columns: 0.82fr 1.18fr;
        gap: 18px;
      }
      .budget-hero {
        background: var(--navy);
        color: #fff;
        border-radius: 26px;
        padding: 28px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        min-height: 505px;
      }
      .budget-hero small {
        font-size: 14px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--aqua);
        font-weight: 800;
      }
      .price {
        font-size: 58px;
        letter-spacing: -0.065em;
        line-height: 0.94;
        font-weight: 800;
        margin: 18px 0 8px;
      }
      .budget-hero p {
        font-size: 14px;
        line-height: 1.6;
        color: rgba(255, 255, 255, 0.68);
      }
      .pay {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .pay div {
        padding: 13px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.08);
      }
      .pay b {
        display: block;
        font-size: 15px;
      }
      .pay span {
        display: block;
        font-size: 14px;
        color: rgba(255, 255, 255, 0.58);
        margin-top: 4px;
      }
      .allocation {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 26px;
        padding: 20px;
      }
      .allocation-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 15px;
        padding: 10px 0;
        border-bottom: 1px solid var(--line);
        align-items: center;
      }
      .allocation-row:last-child {
        border-bottom: 0;
      }
      .allocation-row b {
        font-size: 14px;
      }
      .allocation-row small {
        display: block;
        font-size: 14px;
        line-height: 1.45;
        color: var(--muted);
        margin-top: 3px;
      }
      .allocation-row strong {
        font-size: 14px;
        color: var(--navy);
      }
      .third-party {
        margin-top: 14px;
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 16px;
        background: var(--mint);
      }
