name: Ferrn PHP and JavaScript checks
on:
  push:
    branches:
      - feature/2026-company-profile
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PHP syntax
        run: find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Check JavaScript syntax
        run: find assets -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Smoke-test public routes, policies and login lockout
        run: bash tests/smoke.sh
      - name: Confirm public page routes and admin modules
        run: |
          test -f services/index.php
          test -f about/index.php
          test -f contact/index.php
          test -f careers/index.php
          test -f testimonials/index.php
          test -f admin/sidebar.php
          test -f lib/knowledge-import.php
          test -f lib/policy-defaults.php
  browser:
    if: github.event_name == 'pull_request'
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Check Ferrn desktop and mobile user experience
        run: |
          php -S 127.0.0.1:8766 -t . >/tmp/ferrn-ui-server.log 2>&1 &
          sleep 1
          node tests/ui.mjs
      - name: Save inspection screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ferrn-layout-screenshots
          path: test-screenshots/
          if-no-files-found: ignore
